<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>魔法使いと騎士：六つの外観案</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #171722; color: #eee9f5; }
    body { max-width: 1300px; margin: auto; padding: 24px; line-height: 1.7; }
    h1 { color: #ead19b; } a { color: #e4c987; } .note { color: #c7bfcd; }
    .compare { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
    .panel { border: 1px solid #665976; border-radius: 10px; padding: 16px; background: #252337; }
    label { display: block; margin-bottom: 10px; } select { font: inherit; max-width: 100%; padding: 8px; }
    .image { display: grid; place-items: center; min-height: 260px; background: #363343; }
    img { display: block; max-width: 100%; max-height: 650px; object-fit: contain; }
    ul { columns: 2; padding-left: 20px; } .small { color: #b8afc1; }
    @media (max-width: 700px) { .compare { grid-template-columns: 1fr; } ul { columns: 1; } }
  </style>
</head>
<body>
  <h1>魔法使いと騎士：六つの外観案</h1>
  <p class="note">人物の外観を比較するための生成コンセプトです。ユーザーは魔法使い MA と騎士 KA を選択しました。戦闘用画像や完成したアニメーションではありません。</p>
  <p>各側の選択欄で案を切り替えられます。画像を選ぶと原画を開きます。</p>
  <main class="compare">
    <section class="panel"><label>左側の案 <select id="left"></select></label><a class="image" id="left-link"><img id="left-image" alt=""></a><p id="left-title"></p></section>
    <section class="panel"><label>右側の案 <select id="right"></select></label><a class="image" id="right-link"><img id="right-image" alt=""></a><p id="right-title"></p></section>
  </main>
  <h2>画像一覧</h2>
  <ul id="gallery"></ul>
  <p class="small">画像は当時のまま保存しています。手、顔、武器、表示サイズと透明な縁は、実際の制作時に別途確認が必要です。</p>
  <p><a href="../../character-design-review.md">関連する設計の記録</a> · <a href="prompts.json">生成指示</a> · <a href="manifest.json">素材の一覧</a></p>
  <noscript>比較機能には JavaScript が必要です。画像ファイルは同じフォルダーから直接開けます。</noscript>
  <script>
    const items = [{"id": "MA", "name": "魔法使い A・月庭礼装", "file": "mage-a-lunar.png"}, {"id": "MB", "name": "魔法使い B・旅の装い", "file": "mage-b-wayfarer.png"}, {"id": "MC", "name": "魔法使い C・戦闘服", "file": "mage-c-arcane.png"}, {"id": "KA", "name": "騎士 A・旗と長槍", "file": "knight-a-banner.png"}, {"id": "KB", "name": "騎士 B・軽装の剣と盾", "file": "knight-b-vanguard.png"}, {"id": "KC", "name": "騎士 C・遺物の重刃", "file": "knight-c-relic.png"}];
    const initial = ["MA", "KA"];
    const gallery = document.querySelector('#gallery');
    for (const item of items) {
      const li = document.createElement('li');
      const link = document.createElement('a');
      link.href = item.file;
      link.textContent = `${item.id}：${item.name}`;
      li.append(link);
      gallery.append(li);
    }
    ['left', 'right'].forEach((side, index) => {
      const select = document.getElementById(side);
      for (const item of items) {
        const option = document.createElement('option');
        option.value = item.id;
        option.textContent = `${item.id}：${item.name}`;
        select.append(option);
      }
      select.value = initial[index];
      function render() {
        const item = items.find(candidate => candidate.id === select.value);
        const image = document.getElementById(`${side}-image`);
        image.src = item.file;
        image.alt = `${item.id}：${item.name}のコンセプト画像`;
        document.getElementById(`${side}-link`).href = item.file;
        document.getElementById(`${side}-title`).textContent = `${item.id}：${item.name}`;
      }
      select.addEventListener('change', render);
      render();
    });
  </script>
</body>
</html>
