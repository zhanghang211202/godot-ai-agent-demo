# 実際のプロジェクトで次を実行し、そのディレクトリ用のポートと経路を生成します：
# npm run godot:cli -- setup-mcp codex . --url http://127.0.0.1:<PORT>
# npm run godot:status でこのプロジェクトのローカルポートを確認できます。
# 実際の config.toml はローカル設定であり、Git に含めません。

[mcp_servers.ai-game-developer]
enabled = true
url = "http://127.0.0.1:<PORT>/mcp"
tool_timeout_sec = 300
startup_timeout_sec = 30
